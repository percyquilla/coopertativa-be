quarkus:
  http:
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:3033}
  datasource:
    db-kind: postgresql
    username: ${DB_USERNAME:bienbcb}
    password: ${DB_PASSWORD:bienbcb}
    jdbc:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/bienbcb}
  hibernate-orm:
    database:
      generation: validate
    log:

      sql: false
  flyway:
    migrate-at-start: true
    baseline-on-migrate: false

mp:
  jwt:
    verify:
      publickey:
        location: publicKey.pem
      issuer: https://bienbcb.com/issuer

smallrye:
  jwt:
    sign:
      key:
        location: privateKey.pem

bienbcb:
  jwt:
    duration-minutes: 60
