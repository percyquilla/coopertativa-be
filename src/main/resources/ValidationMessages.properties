# Mensajes de bean validation en español (RF: la app es para personal de la
# cooperativa, no debe mostrar textos en inglés). Sobrescriben los mensajes
# por defecto de Hibernate Validator para TODOS los @Valid del backend.

jakarta.validation.constraints.NotNull.message        = El dato es obligatorio.
jakarta.validation.constraints.NotBlank.message       = El dato es obligatorio.
jakarta.validation.constraints.NotEmpty.message       = Debe indicar al menos un valor.
jakarta.validation.constraints.Null.message           = El dato debe quedar vacío.

jakarta.validation.constraints.Size.message           = El largo debe estar entre {min} y {max} caracteres.
jakarta.validation.constraints.Pattern.message        = El formato no es válido.
jakarta.validation.constraints.Email.message          = El correo no es válido.

jakarta.validation.constraints.Past.message           = La fecha debe ser anterior a hoy.
jakarta.validation.constraints.PastOrPresent.message  = La fecha no puede ser posterior a hoy.
jakarta.validation.constraints.Future.message         = La fecha debe ser posterior a hoy.
jakarta.validation.constraints.FutureOrPresent.message= La fecha no puede ser anterior a hoy.

jakarta.validation.constraints.Positive.message       = Debe ser un número mayor que cero.
jakarta.validation.constraints.PositiveOrZero.message = Debe ser un número mayor o igual a cero.
jakarta.validation.constraints.Negative.message       = Debe ser un número menor que cero.
jakarta.validation.constraints.NegativeOrZero.message = Debe ser un número menor o igual a cero.

jakarta.validation.constraints.Min.message            = Debe ser como mínimo {value}.
jakarta.validation.constraints.Max.message            = Debe ser como máximo {value}.
jakarta.validation.constraints.DecimalMin.message     = Debe ser como mínimo {value}.
jakarta.validation.constraints.DecimalMax.message     = Debe ser como máximo {value}.
jakarta.validation.constraints.Digits.message         = El número no tiene un formato válido.
