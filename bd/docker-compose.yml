services:
  postgres:
    image: postgres:16
    container_name: bienbcb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bienbcb
      POSTGRES_USER: bienbcb
      POSTGRES_PASSWORD: bienbcb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
